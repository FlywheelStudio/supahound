# Supahound scans its own codebase (#127): CodeQL static analysis and dependency review.
# Both are GitHub-native and free for public repositories. Secrets are scanned in ci.yml (gitleaks).
name: Code scanning

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: "17 4 * * 1" # weekly, so new CodeQL queries also run on unchanged code
  workflow_dispatch:

concurrency:
  group: code-scanning-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Fails on new dependencies with a high or critical advisory, or a licence that FSL-1.1-ALv2
      # cannot ship with (decision 025).
      - uses: actions/dependency-review-action@v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          comment-summary-in-pr: never
