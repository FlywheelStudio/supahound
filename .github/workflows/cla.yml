# Contributor License Agreement check (CLA.md, decision 025). An outside contributor signs once by
# commenting the sentence in CLA.md on a pull request. Signatures live on the unprotected
# `cla-signatures` branch, so branch protection on develop and main never blocks them.
#
# pull_request_target runs this file from the base branch with a write token. It never checks out
# or runs the pull request's code. Keep it that way: no actions/checkout in this file.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # contributor-assistant/github-action v2.6.1, pinned by commit.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/FlywheelStudio/supahound/blob/develop/CLA.md
          branch: cla-signatures
          allowlist: erikgoins,dependabot[bot],claude[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
