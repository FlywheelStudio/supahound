# Every pull request links the issue it closes, so all work runs through GitHub issues.
name: PR hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  linked-issue:
    name: Links an issue
    runs-on: ubuntu-24.04
    steps:
      - name: Check for "Closes #n" (or Fixes / Resolves)
        env:
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$AUTHOR" = "dependabot[bot]" ]; then exit 0; fi
          if printf '%s' "$BODY" | grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+'; then
            echo "Linked issue found."
          else
            echo "::error::Add 'Closes #<issue>' to the pull request description."
            exit 1
          fi
