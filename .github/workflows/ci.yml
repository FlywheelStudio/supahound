# Runs on every pull request and on every push to main. A pull request merges only when this is green.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The binary is pinned by version and SHA-256; no third-party action and no licence key.
      # Rules: .gitleaks.toml (decision 025). Scans every commit on the checked-out history.
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

  workflows:
    name: Workflow lint (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned by version and SHA-256, like gitleaks. Fails on any high-severity finding; a finding
      # that is safe by design carries `# zizmor: ignore[<audit>]` and a comment saying why.
      # GH_TOKEN turns on the online audits (impostor commits, known-vulnerable actions).
      - name: Install zizmor 1.32.0
        run: |
          curl -sSfL -o zizmor.tgz https://github.com/zizmorcore/zizmor/releases/download/v1.32.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b  zizmor.tgz" | sha256sum -c -
          tar -xzf zizmor.tgz zizmor
      - name: Audit .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./zizmor --format github --min-severity high .github/workflows

  osv:
    name: Dependency vulnerabilities (OSV)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned by version and SHA-256 (the release's osv-scanner_SHA256SUMS). Fails on any known
      # vulnerability in pnpm-lock.yaml that osv-scanner.toml does not list with a reason and expiry.
      - name: Install osv-scanner 2.7.1
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - run: ./osv-scanner scan source --config osv-scanner.toml --lockfile pnpm-lock.yaml

  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # The database tests start their own throwaway Postgres 17 cluster (packages/core/test/db).
      # Without initdb they fail; CI never sets SUPAHOUND_SKIP_DB_TESTS.
      - name: Install Postgres 17
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -yq postgresql-17
          echo "SUPAHOUND_PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Test (unit, Postgres, workerd)
        env:
          NO_COLOR: "1"
        run: |
          test -z "${SUPAHOUND_SKIP_DB_TESTS:-}" || { echo "DB tests must run in CI"; exit 1; }
          set -o pipefail
          pnpm -r test 2>&1 | tee test.log
          # A skipped suite still exits 0. Fail if any package reports skipped tests.
          if grep -E "Tests .*skipped" test.log; then echo "Skipped tests in CI"; exit 1; fi
      - run: pnpm -r build

  e2e:
    name: E2E and UAT (web, Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install Postgres 17
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -yq postgresql-17
          echo "SUPAHOUND_PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        # --with-deps runs apt-get. When the runner's Ubuntu mirror fails (#92), install only the
        # browser: the runner image already has its libraries, and a missing one fails the tests.
        run: |
          pnpm --filter @supahound/web exec playwright install --with-deps chromium-headless-shell \
            || pnpm --filter @supahound/web exec playwright install chromium-headless-shell
      - run: pnpm e2e
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
