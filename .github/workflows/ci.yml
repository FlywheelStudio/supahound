# Runs on every pull request and on every push to main. A pull request merges only when this is green.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The binary is pinned by version and SHA-256; no third-party action and no licence key.
      # Rules: .gitleaks.toml (decision 025). Scans every commit on the checked-out history.
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # The database tests start their own throwaway Postgres 17 cluster (packages/core/test/db).
      # Without initdb they fail; CI never sets SUPAHOUND_SKIP_DB_TESTS.
      - name: Install Postgres 17
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -yq postgresql-17
          echo "SUPAHOUND_PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Test (unit, Postgres, workerd)
        env:
          NO_COLOR: "1"
        run: |
          test -z "${SUPAHOUND_SKIP_DB_TESTS:-}" || { echo "DB tests must run in CI"; exit 1; }
          set -o pipefail
          pnpm -r test 2>&1 | tee test.log
          # A skipped suite still exits 0. Fail if any package reports skipped tests.
          if grep -E "Tests .*skipped" test.log; then echo "Skipped tests in CI"; exit 1; fi
      - run: pnpm -r build

  e2e:
    name: E2E and UAT (web, Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Postgres 17
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -yq postgresql-17
          echo "SUPAHOUND_PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @supahound/web exec playwright install --with-deps chromium-headless-shell
      - run: pnpm e2e
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
