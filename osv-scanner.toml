# osv-scanner config: the CI job `osv` scans pnpm-lock.yaml and fails on any known vulnerability
# not listed here. Every entry needs a reason (why it cannot be reached) and an expiry; when it
# expires CI fails again, so fix the dependency or renew the entry with a fresh reason.

[[IgnoredVulns]]
id = "GHSA-px8p-9vwx-vf98"
ignoreUntil = 2027-01-31
reason = """fflate 0.7.3 (via vinext -> @vercel/og -> satori). The bug is in unzipSync on malformed \
ZIP64 archives; satori only inflates bundled fonts, and the app has no OG image route or ZIP input. \
Fixed in 0.7.5: drop this entry once vinext or satori moves to it."""

